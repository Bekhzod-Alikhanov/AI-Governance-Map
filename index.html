<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0F172A" />
    <meta
      name="description"
      content="Global AI Governance Map: AI-specific national regulations and international AI governance instruments. A policy-research dashboard."
    />
    <link rel="canonical" href="https://global-ai-governance-map.vercel.app/" />

    <!-- Open Graph / social cards -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Global AI Governance Map" />
    <meta property="og:title" content="Global AI Governance Map" />
    <meta
      property="og:description"
      content="How frontier AI is governed today: countries, frontier-AI labs, international instruments, national + subnational rules, and the dependencies between them. A research dashboard, not legal advice."
    />
    <meta property="og:url" content="https://global-ai-governance-map.vercel.app/" />
    <meta property="og:image" content="https://global-ai-governance-map.vercel.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="World map coloured by AI governance status, with frontier-AI lab headquarters marked and a legend explaining binding law, proposed law, voluntary guidance, and international participation."
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Global AI Governance Map" />
    <meta
      name="twitter:description"
      content="How frontier AI is governed today — countries, labs, international instruments, and the dependencies between them. A research dashboard, not legal advice."
    />
    <meta name="twitter:image" content="https://global-ai-governance-map.vercel.app/og-image.png" />

    <!-- Prerender a record page when the pointer settles on its link. The 543
         record routes are static HTML, so this costs one cheap prefetch and
         removes the navigation entirely when the guess is right. Ignored by
         browsers without support. -->
    <script type="speculationrules">
      {
        "prerender": [
          {
            "where": {
              "href_matches": "/(country|lab|instrument|rule|obligation|exposure|institution|policy-process|standard|public-sector-ai|enforcement)/*"
            },
            "eagerness": "moderate"
          }
        ]
      }
    </script>

    <title>Global AI Governance Map</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
