name: CI

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Validate data
        run: npm run validate:data

      - name: Validate dataset export
        run: npm run validate:export

      - name: Check manual source-verification expiry
        run: npm run audit:manual-checks

      - name: Audit source metadata
        run: npm run audit:sources -- --output=source-audit-report.md --json-output=source-audit-report.json --fail-on-metadata-warnings

      - name: Audit source links (warning-only)
        run: npm run audit:source-links -- --output=source-link-audit-report.md --json-output=source-link-audit-report.json

      - name: Upload source audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: source-audit-report
          path: |
            source-audit-report.md
            source-audit-report.json
            source-link-audit-report.md
            source-link-audit-report.json

      - name: Build editorial data review report
        run: npm run audit:data-review -- --output=data-review-report.md --json-output=data-review-report.json

      - name: Upload editorial data review report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: data-review-report
          path: |
            data-review-report.md
            data-review-report.json

      - name: Build official-source delta report
        run: npm run audit:deltas -- --output=source-delta-report.md --json-output=source-delta-report.json

      - name: Upload official-source delta report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: source-delta-report
          path: |
            source-delta-report.md
            source-delta-report.json

      - name: Build
        run: npm run build

      - name: Validate reproducible release
        run: npm run validate:release

      - name: Summarize research release
        run: |
          node -e 'const fs=require("node:fs"); const snapshot=require("./public/data/full-dataset.json"); const sources=require("./public/data/source-metadata.json"); const release=snapshot.data.datasetReleases.at(-1); const manual=release.unresolvedManualReview.length; const reviewDue=sources.filter((source)=>["needs_review","unreviewed"].includes(source.reviewStatus)).length; const summary=["## Research release",`- Release id: ${release.id}`,`- Status date: ${snapshot.statusAsOf}`,`- Manual checks: ${manual}`,`- Source entries due for review: ${reviewDue}`].join("\n")+"\n"; fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,summary);'

      - name: Check performance budget
        run: npm run check:performance

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end and accessibility tests
        run: npm run test:e2e

      - name: Audit production dependencies
        run: npm audit --omit=dev
